[package]
name = "matter-rs-stack"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
matter-rs-controller = { path = "../controller" }
matter-rs-gen = { path = "../gen" }
# Jens's fork = upstream 03bc8f2 + one additive commit (NocGenerator::
# create_with_fabric_id / issuer-DN mirroring + RcacGenerator::
# generate_without_fabric_id), needed to mint NOCs against migrated matter.js
# roots, whose subject DN legally omits the FabricId RDN. Candidate for an
# upstream PR; repoint at project-chip once merged there.
rs-matter = { git = "https://github.com/Jensderond/rs-matter", rev = "405064b63d152020c76e182d782e5d45e7eb1c0c", features = ["async-io", "max-sessions-32", "case-resumption"] }
embassy-futures = "0.1"
embassy-time = { version = "0.5", features = ["std"] }
embassy-time-queue-utils = { version = "0.3", features = ["generic-queue-64"] }
async-executor = "1"
async-io = "2"
futures-lite = "2"
static_cell = "1"
socket2 = { version = "0.5", features = ["all"] }
if-addrs = "0.15"
rand = { version = "0.8", features = ["std", "std_rng"] }
base64 = "0.22"
serde_json.workspace = true
async-trait.workspace = true
tracing.workspace = true
tokio = { version = "1", features = ["sync", "rt", "time"] }

[dev-dependencies]
tempfile = "3"
# `test-util` for `start_paused` (a 5s shutdown cap is not worth waiting out).
tokio = { version = "1", features = ["macros", "rt", "test-util", "time"] }
