[package]
name = "matter-rs-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "matter_rs_server"
path = "src/lib.rs"

[[bin]]
name = "matter-rs-server"
path = "src/main.rs"

[dependencies]
matter-rs-wire = { path = "../wire" }
matter-rs-controller = { path = "../controller" }
matter-rs-stack = { path = "../stack" }
tokio.workspace = true
axum = { version = "0.8", features = ["ws"] }
clap = { version = "4", features = ["derive", "env"] }
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures-util = "0.3"
# Matches `crates/stack`'s version/features exactly (that crate already pulls
# it in for its dual-stack UDP socket, so this adds no new dependency to the
# graph) — used here for the analogous dual-stack TCP bind in `main.rs`.
socket2 = { version = "0.5", features = ["all"] }

[dev-dependencies]
# 0.24 here vs axum's 0.29 pulled in transitively: two versions of the same
# crate in the graph, but this one is test-only (a WS client, not the server's
# own implementation), so the duplication is accepted rather than chased.
tokio-tungstenite = "0.24"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
tempfile = "3"
