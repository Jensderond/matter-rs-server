[package]
name = "matter-spike"
version = "0.1.0"
edition = "2021"
publish = false

# Phase 0 spike — see docs/superpowers/specs/2026-08-13-phase0-spike.md
# Throwaway quality by design; not part of the future server workspace.

[workspace]

[dependencies]
log = "0.4"
env_logger = "0.11"
embassy-futures = "0.1"
embassy-time = { version = "0.5", features = ["std"] }
embassy-time-queue-utils = { version = "0.3", features = ["generic-queue-64"] }
static_cell = "1"
if-addrs = "0.15"
async-io = "2"
futures-lite = "2"
socket2 = "0.5"
rand = { version = "0.8", features = ["std", "std_rng"] }
rs-matter = { git = "https://github.com/project-chip/rs-matter", rev = "03bc8f2aeb7765a93e7863e2263f73c7bbc3d401", features = ["async-io", "max-sessions-32"] }
